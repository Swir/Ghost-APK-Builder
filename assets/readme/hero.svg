<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ghost APK Builder — SWIR project banner</title>
  <desc id="desc">Dark electric-cyan banner for Ghost APK Builder, a Windows native Android APK and AAB build tool.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset=".55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset=".5" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".05"/></pattern></defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity=".25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 250 C180 210 250 300 430 258 S720 214 885 248 S1070 282 1200 232" fill="none" stroke="url(#cyan)" stroke-opacity=".24" stroke-width="2"/>
  <g transform="translate(72 64)"><rect width="170" height="170" rx="34" fill="#07111C" stroke="#62E5FF" stroke-opacity=".5"/><path d="M45 126V75C45 43 62 25 85 25C108 25 125 43 125 75V126L107 113L91 128L75 113L59 128Z" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/><circle cx="72" cy="70" r="7" fill="#62E5FF"/><circle cx="99" cy="70" r="7" fill="#62E5FF"/></g>
  <text x="285" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="285" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#F4FAFF">Ghost APK Builder</text>
  <text x="287" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Native Kotlin APK / AAB builder for Windows</text>
  <text x="287" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">ANDROID API 36  •  WINDOWS X64  •  PUBLIC BETA</text>
</svg>
