<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#10131d"><title>Konofix Android</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="brand"><img src="icon.svg" width="56" height="56" alt=""><div><small>ANDROID ↔ PC</small><h1>Konofix<span>.</span></h1></div><select id="locale" aria-label="Language"><option value="auto">Auto</option><option value="pl">PL</option><option value="en">EN</option><option value="nb">NO</option></select></header><main><section class="card" id="login"><h2 data-t="title"></h2><p data-t="hint" class="muted"></p><form id="connect-form"><label for="nick" data-t="nick"></label><input id="nick" required maxlength="64" autocomplete="nickname" autocapitalize="off" spellcheck="false" placeholder="SwirPhone"><label for="color" data-t="color"></label><select id="color"></select><details><summary data-t="advanced"></summary><label for="seeds" data-t="seeds"></label><textarea id="seeds" rows="3" autocapitalize="off" spellcheck="false" placeholder="/ip4/192.168.1.10/tcp/…/p2p/…"></textarea></details><button id="connect" type="submit" data-t="connect"></button></form></section><section id="chat" hidden><div class="heading"><h2>#WORLD</h2><button id="disconnect" class="secondary" data-t="disconnect"></button></div><div id="timeline" role="log" aria-live="polite"></div><form id="message-form"><label for="message" data-t="message"></label><textarea id="message" rows="2" maxlength="8000"></textarea><button id="send" type="submit" data-t="send"></button></form><p class="muted" data-t="receipt"></p></section><p id="error" role="alert" class="error" hidden></p><section class="card diagnostic"><h3 data-t="diagnostics"></h3><p id="status"></p><p id="peer" class="peer"></p><button id="refresh" class="secondary" data-t="refresh"></button><pre id="logs"></pre></section><p class="muted" data-t="scope"></p><p class="muted" data-t="background"></p><p class="muted" id="no-runtime" data-t="runtimeMissing" hidden></p></main><footer>by Swir · 0.1.0-dev.2 · PC baseline 0.5.1</footer></div><script type="module" src="app.mjs"></script></body></html>
