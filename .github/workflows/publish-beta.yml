name: Trigger Ghost v17 Publish

on:
  push:
    branches:
      - "release/v17.*"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^v17\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid v17 release branch version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Dispatch verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f version="$VERSION" \
            --repo "${{ github.repository }}"
