name: Trigger Ghost Beta Publish

on:
  push:
    branches:
      - "release/v17.0.0-beta.1"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f version=v17.0.0-beta.1 \
            --repo "${{ github.repository }}"
