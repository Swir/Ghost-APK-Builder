name: SwirSMS 0.2 APK build

on:
  push:
    branches:
      - swirsms-02-apk-build
    paths:
      - '.github/workflows/swirsms-02-apk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore SwirSMS 0.2 source
        shell: bash
        run: |
          cat swirsms_payload_02/part0.b64 swirsms_payload_02/part1.b64 swirsms_payload_02/part2.b64 > /tmp/swirsms02.b64
          base64 -d /tmp/swirsms02.b64 | tar -xz
          test -f SwirSMS-0.2-beta/settings.gradle.kts
          test -f SwirSMS-0.2-beta/app/src/main/java/com/swir/swirsms/SwirSmsApp.kt
          test -f SwirSMS-0.2-beta/server/v1/send.php

      - name: Build debug APK
        working-directory: SwirSMS-0.2-beta
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="SwirSMS-0.2-beta/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          cp "$APK" SwirSMS-0.2-beta-debug.apk
          sha256sum SwirSMS-0.2-beta-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwirSMS-0.2-beta-debug
          path: SwirSMS-0.2-beta-debug.apk
          if-no-files-found: error
          retention-days: 7
