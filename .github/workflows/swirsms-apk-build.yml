name: SwirSMS APK build

on:
  push:
    branches:
      - swirsms-apk-build
    paths:
      - '.github/workflows/swirsms-apk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore SwirSMS source
        shell: bash
        run: |
          cat swirsms_payload/part1.b64 swirsms_payload/part2.b64 swirsms_payload/part3.b64 swirsms_payload/part4.b64 swirsms_payload/part5.b64 > /tmp/swirsms-src.b64
          base64 -d /tmp/swirsms-src.b64 | tar -xz
          test -f SwirSMS-0.1-beta/settings.gradle.kts

      - name: Build debug APK
        working-directory: SwirSMS-0.1-beta
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f SwirSMS-0.1-beta/app/build/outputs/apk/debug/app-debug.apk
          cp SwirSMS-0.1-beta/app/build/outputs/apk/debug/app-debug.apk SwirSMS-0.1-beta-debug.apk
          sha256sum SwirSMS-0.1-beta-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwirSMS-0.1-beta-debug
          path: SwirSMS-0.1-beta-debug.apk
          if-no-files-found: error
          retention-days: 7
