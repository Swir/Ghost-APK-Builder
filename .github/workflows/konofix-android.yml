name: Konofix Android isolated APK
on:
  push:
    branches: [konofix-android-apk-isolated-20260927]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: konofix-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.repository == 'Swir/Ghost-APK-Builder' && github.ref == 'refs/heads/konofix-android-apk-isolated-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check source syntax and import pinned PC core read-only
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" != 'Swir/Konofix'
          python -m py_compile scripts/import_core.py scripts/post_init.py scripts/android_dns.py
          node --check web/core.mjs
          node --check web/app.mjs
          python scripts/import_core.py
          python scripts/android_dns.py --native
          npm run build
      - name: Restore Android compilation cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: konofix-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            konofix-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-
            konofix-android-${{ runner.os }}-
      - name: Configure Rust and Android toolchains
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Initialize Android candidate
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run tauri -- icon web/icon.svg
          npm run android:init
          python scripts/post_init.py
          python scripts/android_dns.py --android
      - name: Build signed debug APK with native P2P core
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm run android:build 2>&1 | tee evidence/android-build.log
      - name: Verify and collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t APK_FILES < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#APK_FILES[@]}" -ge 1
          APK="${APK_FILES[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee out/signature-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > out/apk-metadata.txt
          grep -q "io.github.swir.konofix.android" out/apk-metadata.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/libkonofix_android_lib.so'
          cp "$APK" out/Konofix-Android-0.1.0-dev.2-arm64.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          git rev-parse HEAD > out/android-source-commit.txt
          cp src-tauri/generated/import-report.json out/
          cp src-tauri/Cargo.lock package-lock.json TESTING.md out/
          printf 'Debug-signed ARM64 candidate. Real Android-to-PC interoperability has NOT been tested. PC source is read-only; no PC files or releases were modified. Keep the app in the foreground during testing. #WORLD text only. Fully restart Android app after switching Wi-Fi/LTE.\n' > out/TEST-NOTES.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Konofix-Android-APK
          path: out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Konofix-Android-build-evidence
          path: |
            evidence/
            src-tauri/generated/import-report.json
            src-tauri/generated/src/lib.rs
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
            src-tauri/gen/android/app/src/main/java/
            src-tauri/Cargo.lock
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Android compilation cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
