name: SwirSMS Standalone APK
on:
  push:
    branches: [swirsms-03-apk-build]
    paths: ['SwirSMS/**', '.github/workflows/swirsms-standalone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Preserve source and integrity manifest
        shell: bash
        run: |
          mkdir -p source-evidence
          find SwirSMS -type f -print0 | sort -z | xargs -0 sha256sum > source-evidence/SOURCE-SHA256SUMS.txt
          zip -qr source-evidence/SwirSMS-0.3-Standalone-source.zip SwirSMS
      - uses: actions/upload-artifact@v4
        with:
          name: SwirSMS-Standalone-source
          path: source-evidence/
          retention-days: 14
      - name: Compile, unit test and lint
        working-directory: SwirSMS
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify and package
        shell: bash
        run: |
          mkdir -p deliverables/VERIFICATION
          APK=SwirSMS/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > deliverables/VERIFICATION/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > deliverables/VERIFICATION/package.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > deliverables/VERIFICATION/permissions.txt
          if grep -q 'android.permission.INTERNET' deliverables/VERIFICATION/permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          cp "$APK" deliverables/SwirSMS-0.3-Standalone.apk
          (cd deliverables; sha256sum SwirSMS-0.3-Standalone.apk > SHA256SUMS.txt)
          cp -r SwirSMS/app/build/test-results deliverables/VERIFICATION/unit-tests
          cp SwirSMS/app/build/reports/lint-results-debug.* deliverables/VERIFICATION/
          cp source-evidence/* deliverables/
      - uses: actions/upload-artifact@v4
        with:
          name: SwirSMS-Standalone-build
          path: deliverables/
          retention-days: 14
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator UI and persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: status=0; (cd SwirSMS && gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace) || status=$?; mkdir -p device-evidence; adb pull /sdcard/Android/data/com.swir.swirsms.standalone/files/screenshots device-evidence/ || true; exit $status
      - name: Collect device reports
        if: always()
        run: |
          mkdir -p device-evidence
          cp -r SwirSMS/app/build/reports/androidTests device-evidence/ 2>/dev/null || true
          cp -r SwirSMS/app/build/outputs/androidTest-results device-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwirSMS-Standalone-device-tests
          path: |
            device-evidence/
            SwirSMS/app/build/reports/
            SwirSMS/app/build/test-results/
          retention-days: 14
