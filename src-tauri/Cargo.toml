[package]
name = "konofix-android"
version = "0.1.0-dev.2"
edition = "2021"
rust-version = "1.88"
autobins = false
[lib]
path = "generated/src/lib.rs"
name = "konofix_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
slug = "0.1"
unicode-normalization = "0.1"
sha2 = "0.11"
hex = "0.4"
dirs = "7"
libp2p = { version = "0.57", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "gossipsub", "mdns", "kad", "identify", "ping", "autonat", "relay", "dcutr", "upnp", "request-response", "cbor", "macros"] }
